[project]
name = "di-validator"
version = "0.1.0"
description = "Local smart meter algorithm validation workbench"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "scipy>=1.15,<2",
  "scikit-learn>=1.6,<2",
  "pyarrow>=19,<25",
  "duckdb>=1.2,<2",
  "joblib>=1.4",
  "psutil>=6",
  "pydantic>=2.10,<3",
  "matplotlib>=3.10,<4",
  "jupyterlite-core[contents]>=0.8,<0.9",
  "jupyterlite-pyodide-kernel>=0.8,<0.9",
  "xgboost==3.4.1",
  "lightgbm==4.7.0",
  "prophet==1.4.0",
  "comtrade==0.1.2",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["di_validator"]

[tool.pytest.ini_options]
testpaths = ["tests", "reference/test_ev_pv_detection.py"]
filterwarnings = ["ignore:.*Precision is ill-defined.*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
